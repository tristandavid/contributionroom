name: Live dry run (temporary)
on:
  push:
    branches: [tax-brackets]
    paths: [".github/workflows/capture-tax-pages.yml"]
permissions:
  contents: write
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run against the live pages
        run: |
          mkdir -p dryrun
          python3 scripts/test_update_limits.py > dryrun/tests.txt 2>&1 || true
          python3 scripts/update_limits.py --dry-run > dryrun/run.txt 2>&1 || echo "exit $?" >> dryrun/run.txt
          cp .tax-notes.md dryrun/ 2>/dev/null || true
          python3 - > dryrun/probe.txt 2>&1 <<'PY' || true
          import sys; sys.path.insert(0, "scripts"); import update_limits as U
          for y in (2026, 2027):
              for k in (U.T4127_RATES, U.T4127_OTHER):
                  try: print(y, k, "OK", len(U.t4127_csv(k, y)))
                  except Exception as e: print(y, k, type(e).__name__, e)
              try: print(y, "US", U.us_tax(y))
              except Exception as e: print(y, "US", type(e).__name__, e)
          PY
      - name: Commit
        run: |
          git config user.name "contribution-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dryrun
          git commit -m "Live dry run (temporary)" && git push || echo nothing
