name: Capture tax pages (temporary)
on:
  push:
    branches: [tax-brackets]
    paths: [".github/workflows/capture-tax-pages.yml"]
# round 4
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the pages as test fixtures
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import update_limits as U
          pages = {
            "cra_rates": "https://www.canada.ca/en/revenue-agency/services/tax/individuals/frequently-asked-questions-individuals/canadian-income-tax-rates-individuals-current-previous-years.html",
            "cra_index": "https://www.canada.ca/en/revenue-agency/services/tax/individuals/frequently-asked-questions-individuals/adjustment-personal-income-tax-benefit-amounts.html",
            "irs_brackets": "https://www.irs.gov/filing/federal-income-tax-rates-and-brackets",
            "cra_year": "https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/current-year.html",
            "cra_all_years": "https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/all-years.html",
            "irs_release": "https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill",
            "irs_newsroom": "https://www.irs.gov/newsroom",
            "irs_news_releases": "https://www.irs.gov/newsroom/news-releases-for-current-month",
            "cra_t4127": "https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/t4127-payroll-deductions-formulas/t4127-jan/t4127-jan-payroll-deductions-formulas-computer-programs.html",
            "cra_t4127_other": "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/thrrtsmnts-01-26e.csv",
            "cra_t4127_rates": "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4127-jan/rtsncmtrshldcnstnt-01-26e.csv",
            "rq_rates": "https://www.revenuquebec.ca/en/citizens/income-tax-return/completing-your-income-tax-return/income-tax-rates/",
            "rq_bpa": "https://www.revenuquebec.ca/en/citizens/income-tax-return/completing-your-income-tax-return/completing-your-return/line-by-line-help/350-to-398-1-non-refundable-tax-credits/line-350/",
          }
          # second capture round: only fetch what is new
          pages = {k: v for k, v in pages.items() if not os.path.exists(f"scripts/fixtures/raw/{k}.html")}
          os.makedirs("scripts/fixtures/raw", exist_ok=True)
          for name, url in pages.items():
              try:
                  raw = U.fetch(url)
              except Exception as e:
                  open(f"scripts/fixtures/raw/{name}.error.txt", "w").write(repr(e))
                  import urllib.request
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36", "Accept": "text/html", "Accept-Language": "en-CA,en"})
                      raw = urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "replace")
                  except Exception as e2:
                      open(f"scripts/fixtures/raw/{name}.error2.txt", "w").write(repr(e2)); continue
              open(f"scripts/fixtures/raw/{name}.html", "w").write(raw)
              text, tables = U.parse_html(raw)
              json.dump({"text": text, "tables": tables}, open(f"scripts/fixtures/{name}.json", "w"), ensure_ascii=False)
              print(name, len(raw), len(tables))
          PY
      - name: Commit
        run: |
          git config user.name "contribution-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fixtures
          git commit -m "Capture tax pages (temporary)" && git push || echo nothing
